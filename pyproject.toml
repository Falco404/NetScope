[project]
name = "netscope"
version = "0.1.0"
description = "Local network discovery and mapping tool (private ranges only)"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["License :: OSI Approved :: MIT License"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "zeroconf>=0.154.0",
]

[dependency-groups]
# Synced by plain `uv sync`. Do NOT move these to [project.optional-dependencies]:
# `uv sync` is declarative, so an opt-in extra means a plain `uv sync` *uninstalls*
# pytest and ruff from a working environment (uv then fails `uv run pytest` with
# "Failed to spawn: pytest").
dev = ["pytest>=8", "ruff>=0.9", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
