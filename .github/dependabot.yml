# Dependabot: keep the locked Python deps and the CI actions current
# (security review NS-14 — "no automated vulnerability scanning").
#
# `uv` is the ecosystem value GitHub uses for uv-managed projects: it updates
# `uv.lock` from `pyproject.toml`, which is the file this repo actually runs
# from (CI does a plain `uv sync`). `pip` would read `pyproject.toml` but
# cannot keep the lock in step.
#
# Deliberately weekly and capped: this is a small project, and a wall of
# dependency PRs is how review stops happening. Vulnerability fixes arrive
# through Dependabot alerts regardless of the schedule below.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
