name: tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege (security review NS-13): the suite only reads the checkout.
# Without this block the job inherits the repository default for GITHUB_TOKEN,
# which is often read/write — and third-party actions run with that token.
permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest
